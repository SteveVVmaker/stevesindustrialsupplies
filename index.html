<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Steves Industrial Supplies</title>
<meta name="description" content="Industrial supplies, tools and surplus. Shop the Steves Industrial Supplies eBay store.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔩</text></svg>">
<style>
  /* ============================================================
     EDIT THESE THREE THINGS IN THE HTML BELOW:
       1. The href on the button (your eBay store link)
       2. The tagline
       3. The line of text under the button (or delete it)
     ============================================================ */

  :root {
    --steel-green: #2e4a40;
    --steel-green-dark: #22382f;
    --label: #e6e8e3;
    --ink: #1d2320;
    --muted: #55605a;
    --stamp: #b3261e;
    --stamp-hover: #8f1d17;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--steel-green);
    background-image: repeating-linear-gradient(
      90deg, transparent 0 38px, rgba(0,0,0,.06) 38px 40px);
    font-family: "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
  }

  /* The label, like a tag riveted to a parts bin */
  .label {
    position: relative;
    width: 100%;
    max-width: 560px;
    background: var(--label);
    padding: 48px 44px 40px;
    border-radius: 4px;
    box-shadow: 0 2px 0 var(--steel-green-dark), 0 18px 40px rgba(0,0,0,.35);
  }

  .rivet {
    position: absolute;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #f4f5f2, #8b918c 70%);
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.25);
  }
  .rivet.tl { top: 14px; left: 14px; }
  .rivet.tr { top: 14px; right: 14px; }
  .rivet.bl { bottom: 14px; left: 14px; }
  .rivet.br { bottom: 14px; right: 14px; }

  h1 {
    margin: 0 0 14px;
    font-family: Impact, "Arial Narrow Bold", "Arial Narrow", sans-serif;
    font-weight: 400;
    font-size: clamp(2.6rem, 11vw, 4.4rem);
    line-height: .95;
    letter-spacing: .01em;
  }

  .tagline {
    margin: 0 0 32px;
    max-width: 34ch;
    font-size: 1.1rem;
    line-height: 1.5;
    color: var(--muted);
  }

  .shop {
    display: inline-block;
    padding: 16px 30px;
    background: var(--stamp);
    color: #fff;
    font-size: 1.05rem;
    font-weight: 700;
    text-decoration: none;
    border-radius: 3px;
    box-shadow: 0 3px 0 #7a1a14;
    transition: transform .08s ease, box-shadow .08s ease, background .15s ease;
  }
  .shop:hover { background: var(--stamp-hover); }
  .shop:active { transform: translateY(2px); box-shadow: 0 1px 0 #7a1a14; }
  .shop:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

  .note {
    margin: 22px 0 0;
    font-size: .95rem;
    color: var(--muted);
  }

  @media (max-width: 480px) {
    .label { padding: 44px 26px 34px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .shop { transition: none; }
  }
</style>
</head>
<body>
  <main class="label">
    <span class="rivet tl"></span><span class="rivet tr"></span>
    <span class="rivet bl"></span><span class="rivet br"></span>

    <h1>Steves Industrial Supplies</h1>
    <p class="tagline">Industrial supplies, tools and surplus.</p>

    <!-- 1. PASTE YOUR EBAY STORE LINK BETWEEN THE QUOTES BELOW -->
    <a class="shop" href="PASTE-YOUR-EBAY-STORE-LINK-HERE" target="_blank" rel="noopener">Shop the eBay store</a>

    <p class="note">Find us on eBay as Steves Industrial Supplies.</p>
  </main>
</body>
</html>
