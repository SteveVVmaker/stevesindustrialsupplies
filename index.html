<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Steves Industrial Supplies</title>
<meta name="description" content="Industrial supplies, tools and surplus. Shop the Steves Industrial Supplies eBay store.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔩</text></svg>">
<style>
  :root {
    --steel-green: #2e4a40;
    --steel-green-dark: #22382f;
    --label: #e6e8e3;
    --ink: #1d2320;
    --muted: #55605a;
    --stamp: #b3261e;
    --stamp-hover: #8f1d17;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    padding: 32px 20px 48px;
    background: var(--steel-green);
    background-image: repeating-linear-gradient(
      90deg, transparent 0 38px, rgba(0,0,0,.06) 38px 40px);
    font-family: "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
  }

  .wrap { max-width: 1000px; margin: 0 auto; }

  /* Header label, like a tag riveted to a parts bin */
  .label {
    position: relative;
    background: var(--label);
    padding: 48px 44px 40px;
    border-radius: 4px;
    box-shadow: 0 2px 0 var(--steel-green-dark), 0 18px 40px rgba(0,0,0,.35);
  }

  .rivet {
    position: absolute;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #f4f5f2, #8b918c 70%);
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.25);
  }
  .rivet.tl { top: 14px; left: 14px; }
  .rivet.tr { top: 14px; right: 14px; }
  .rivet.bl { bottom: 14px; left: 14px; }
  .rivet.br { bottom: 14px; right: 14px; }

  h1, h2 {
    font-family: Impact, "Arial Narrow Bold", "Arial Narrow", sans-serif;
    font-weight: 400;
    letter-spacing: .01em;
    margin: 0;
  }

  h1 {
    margin-bottom: 14px;
    font-size: clamp(2.6rem, 9vw, 4.6rem);
    line-height: .95;
  }

  .tagline {
    margin: 0 0 30px;
    max-width: 40ch;
    font-size: 1.1rem;
    line-height: 1.5;
    color: var(--muted);
  }

  .shop {
    display: inline-block;
    padding: 16px 30px;
    background: var(--stamp);
    color: #fff;
    font-size: 1.05rem;
    font-weight: 700;
    text-decoration: none;
    border-radius: 3px;
    box-shadow: 0 3px 0 #7a1a14;
    transition: transform .08s ease, box-shadow .08s ease, background .15s ease;
  }
  .shop:hover { background: var(--stamp-hover); }
  .shop:active { transform: translateY(2px); box-shadow: 0 1px 0 #7a1a14; }
  .shop:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

  /* Gallery */
  .shelf { margin-top: 56px; }

  .shelf section + section { margin-top: 48px; }

  h2 {
    margin-bottom: 18px;
    color: var(--label);
    font-size: clamp(1.7rem, 5vw, 2.2rem);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 16px;
  }

  figure {
    margin: 0;
    background: var(--label);
    padding: 8px 8px 0;
    border-radius: 3px;
    box-shadow: 0 2px 0 var(--steel-green-dark), 0 8px 20px rgba(0,0,0,.25);
  }

  figure a { display: block; }
  figure a:focus-visible { outline: 3px solid var(--stamp); outline-offset: 2px; }

  figure img {
    display: block;
    width: 100%;
    aspect-ratio: 4 / 3;
    object-fit: cover;
    background: #cfd2cc;
  }

  figcaption {
    padding: 10px 4px 12px;
    font-size: .92rem;
    line-height: 1.35;
    color: var(--ink);
  }

  footer {
    margin-top: 56px;
    text-align: center;
    color: var(--label);
  }
  footer p { margin: 0 0 18px; font-size: 1.05rem; }

  @media (max-width: 480px) {
    .label { padding: 44px 26px 34px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .shop { transition: none; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="label">
    <span class="rivet tl"></span><span class="rivet tr"></span>
    <span class="rivet bl"></span><span class="rivet br"></span>

    <h1>Steves Industrial Supplies</h1>
    <p class="tagline">Industrial supplies, tools and surplus.</p>
    <a class="shop" href="https://www.ebay.ca/usr/stevesindustrialsupplies" target="_blank" rel="noopener">Shop the eBay store</a>
  </header>

  <main class="shelf">
    <section>
      <h2>Flow measurement</h2>
      <div class="grid">
        <figure>
          <a href="images/micro-motion-flow-meter.jpg" target="_blank" rel="noopener">
            <img src="images/micro-motion-flow-meter.jpg" alt="Emerson Micro Motion Coriolis mass flow sensor with blue transmitter, in shipping packaging" loading="lazy">
          </a>
          <figcaption>Emerson Micro Motion Coriolis mass flow sensor</figcaption>
        </figure>
        <figure>
          <a href="images/micro-motion-transmitter.jpg" target="_blank" rel="noopener">
            <img src="images/micro-motion-transmitter.jpg" alt="Close-up of the Micro Motion transmitter display and buttons" loading="lazy">
          </a>
          <figcaption>Transmitter display and controls</figcaption>
        </figure>
        <figure>
          <a href="images/micro-motion-nameplate.jpg" target="_blank" rel="noopener">
            <img src="images/micro-motion-nameplate.jpg" alt="Micro Motion nameplates showing model, ratings and calibration data" loading="lazy">
          </a>
          <figcaption>Nameplate and calibration details</figcaption>
        </figure>
      </div>
    </section>

    <section>
      <h2>Control valves</h2>
      <div class="grid">
        <figure>
          <a href="images/fisher-control-valve.jpg" target="_blank" rel="noopener">
            <img src="images/fisher-control-valve.jpg" alt="Green Fisher control valve with actuator and positioner in a shipping crate" loading="lazy">
          </a>
          <figcaption>Fisher control valve with actuator and positioner</figcaption>
        </figure>
        <figure>
          <a href="images/fisher-valve-side.jpg" target="_blank" rel="noopener">
            <img src="images/fisher-valve-side.jpg" alt="Side view of the Fisher control valve and actuator" loading="lazy">
          </a>
          <figcaption>Side view of valve and actuator</figcaption>
        </figure>
        <figure>
          <a href="images/fisher-actuator.jpg" target="_blank" rel="noopener">
            <img src="images/fisher-actuator.jpg" alt="Fisher actuator diaphragm casing with warning labels and nameplate" loading="lazy">
          </a>
          <figcaption>Actuator casing with labels and nameplate</figcaption>
        </figure>
        <figure>
          <a href="images/fisher-67cfr-regulator.jpg" target="_blank" rel="noopener">
            <img src="images/fisher-67cfr-regulator.jpg" alt="Fisher 67CFR pressure regulator mounted on the valve" loading="lazy">
          </a>
          <figcaption>Fisher 67CFR pressure regulator</figcaption>
        </figure>
      </div>
    </section>
  </main>

  <footer>
    <p>See current listings, prices and shipping on eBay.</p>
    <a class="shop" href="https://www.ebay.ca/usr/stevesindustrialsupplies" target="_blank" rel="noopener">Shop the eBay store</a>
  </footer>

</div>
</body>
</html>
